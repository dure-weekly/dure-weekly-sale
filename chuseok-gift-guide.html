    var GG_PAGE_SIZE = 12;
    var GG_PAGE_STATE = {}; // slug -> 현재 페이지(0부터 시작)
    var ggDetailsCache = null;

    function ggFmtNum(n) { return n.toLocaleString('ko-KR'); }
    function ggFmtWon(n) { return n.toLocaleString('ko-KR') + '<span class="unit">원</span>'; }

    /* ---------------- 카드(그리드) + 페이지 번호 렌더링 ---------------- */

    function ggBuildCardHtml(code) {
      var item = GG_PRODUCTS[code];
      if (!item) return '';
      var rate = item.hasDiscount ? Math.round((1 - item.salePrice / item.originalPrice) * 100) : 0;
      var badgeHtml = rate > 0
        ? '<span class="discount-badge" aria-hidden="true"><strong>' + rate + '<span class="unit">%</span></strong><span class="badge-sub">할인</span></span>'
        : '';
      var priceBlockHtml = item.hasDiscount
        ? '<div class="price-block"><div class="price-row"><span class="price-original">' + ggFmtNum(item.originalPrice) + '</span><span class="price-sale">' + ggFmtWon(item.salePrice) + '</span></div><span class="price-save">' + ggFmtWon(item.originalPrice - item.salePrice) + ' 절약</span></div>'
        : '<div class="price-block"><div class="price-row"><span class="price-sale">' + ggFmtWon(item.salePrice) + '</span></div></div>';

      return '<article class="product-card is-clickable" data-code="' + code + '" role="button" tabindex="0">' +
        '<div class="product-thumb">' +
        badgeHtml +
        '<img class="product-image" src="' + item.image + '" alt="' + item.name + '" loading="lazy" onerror="this.remove();" />' +
        '<span class="product-icon-wrap" aria-hidden="true">🎁</span>' +
        '</div>' +
        '<div class="product-body">' +
        '<p class="product-name">' + item.name + '</p>' +
        '<p class="product-desc">' + item.description + '</p>' +
        priceBlockHtml +
        '<p class="gg-spec-line">' + item.spec + '</p>' +
        '</div></article>';
    }

    function ggScrollToBandTop(slug) {
      var target = document.getElementById('band-' + slug);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function ggGoToPage(band, page) {
      GG_PAGE_STATE[band.slug] = page;
      var grid = document.getElementById('grid-' + band.slug);
      var start = page * GG_PAGE_SIZE;
      var end = Math.min(start + GG_PAGE_SIZE, band.codes.length);
      var html = '';
      for (var i = start; i < end; i++) html += ggBuildCardHtml(band.codes[i]);
      grid.innerHTML = html;
      ggRenderPagination(band);
      ggRenderBandNav(band);
      ggScrollToBandTop(band.slug);
    }

    function ggRenderPagination(band) {
      var wrap = document.getElementById('pagination-' + band.slug);
      if (!wrap) return;
      var totalPages = Math.ceil(band.codes.length / GG_PAGE_SIZE);
      if (totalPages <= 1) { wrap.innerHTML = ''; return; }
      var current = GG_PAGE_STATE[band.slug] || 0;
      var html = '';
      for (var i = 0; i < totalPages; i++) {
        html += '<button type="button" class="filter-chip gg-page-btn" aria-selected="' + (i === current ? 'true' : 'false') + '" data-page="' + i + '">' + (i + 1) + '</button>';
      }
      wrap.innerHTML = html;
      Array.prototype.forEach.call(wrap.querySelectorAll('.gg-page-btn'), function (btn) {
        btn.addEventListener('click', function () { ggGoToPage(band, parseInt(btn.dataset.page, 10)); });
      });
    }

    // 각 금액대 하단에 "이 금액대 처음으로"(구체적 이름 포함)와 "금액대 변경"(맨 위 탭으로 이동)을
    // 항상 짝지어 보여준다 — 사이트 전역의 sticky 탭바 동작 여부와 무관하게 항상 동작해야 하므로,
    // 실제 화면 이동은 앵커 스크롤(scrollIntoView)만으로 처리한다.
    function ggRenderBandNav(band) {
      var wrap = document.getElementById('nav-' + band.slug);
      if (!wrap) return;
      wrap.innerHTML = '';

      var topBtn = document.createElement('button');
      topBtn.type = 'button';
      topBtn.className = 'btn btn-outline btn-totop';
      topBtn.textContent = '▲ ' + band.label + ' 처음으로';
      topBtn.addEventListener('click', function () { ggScrollToBandTop(band.slug); });
      wrap.appendChild(topBtn);

      var changeBtn = document.createElement('button');
      changeBtn.type = 'button';
      changeBtn.className = 'btn btn-outline btn-totop';
      changeBtn.textContent = '금액대 변경 ↑';
      // 금액대 탭(nav)이 position:sticky라, 그 요소 자체를 scrollIntoView로 조준하면
      // 브라우저가 "이미 화면에 붙어있는" 위치를 기준으로 계산이 꼬여 엉뚱한 곳으로 튄다.
      // 절대 좌표(맨 위)로 바로 스크롤하면 sticky 여부와 무관하게 항상 정확하다.
      changeBtn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      wrap.appendChild(changeBtn);
    }

    /* ---------------- 상세보기 오버레이 ---------------- */

    function ggBuildRecipesHtml(recipes) {
      if (!recipes || recipes.length === 0) return '';
      var cards = recipes.map(function (r, idx) {
        var stepsHtml = r.steps && r.steps.length ? '<ol class="recipe-card-steps">' + r.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' : '';
        return '<div class="recipe-card">' +
          '<span class="recipe-card-num">' + (idx + 1) + '</span>' +
          '<span class="recipe-card-icon" aria-hidden="true">' + (r.icon || '🍽') + '</span>' +
          '<p class="recipe-card-name">' + (r.name || '') + '</p>' +
          stepsHtml +
          (r.tagline ? '<p class="recipe-card-tagline">' + r.tagline + '</p>' : '') +
          '</div>';
      }).join('');
      return '<div class="detail-section"><h3>🍳 요리 tip</h3><div class="recipe-card-grid">' + cards + '</div></div>';
    }

    function ggBuildSpecsHtml(specs) {
      if (!specs || Object.keys(specs).length === 0) return '';
      var rows = Object.entries(specs).map(function (e) {
        return '<div class="detail-spec-row"><span class="detail-spec-key">' + e[0] + '</span><span class="detail-spec-val">' + e[1] + '</span></div>';
      }).join('');
      return '<div class="detail-section"><h3>📋 사양정보</h3><div class="detail-specs">' + rows + '</div></div>';
    }

    function ggBuildReviewsHtml(reviews) {
      if (!reviews || reviews.length === 0) return '';
      var items = reviews.map(function (r) {
        var stars = r.rating ? '⭐'.repeat(Math.round(r.rating)) : '';
        var yearsTag = r.years != null ? '<span class="detail-review-years">' + r.years + '년차</span>' : '';
        var author = r.author ? '<span class="detail-review-author">' + yearsTag + r.author + ' 조합원</span>' : '';
        return '<li class="detail-review">' + (stars ? '<span class="detail-review-stars">' + stars + '</span>' : '') + '<p>' + r.text + '</p>' + author + '</li>';
      }).join('');
      return '<div class="detail-section"><h3>💬 조합원 이용후기</h3><ul class="detail-review-list">' + items + '</ul></div>';
    }

    async function ggLoadDetails() {
      if (ggDetailsCache) return ggDetailsCache;
      try {
        var res = await fetch('data/goodsDetails.json');
        ggDetailsCache = await res.json();
      } catch (err) {
        ggDetailsCache = {};
      }
      return ggDetailsCache;
    }

    async function ggOpenDetail(code) {
      var overlay = document.getElementById('detail-overlay');
      var content = document.getElementById('detail-content');
      var item = GG_PRODUCTS[code];
      if (!overlay || !content || !item) return;

      content.innerHTML = '<p class="product-grid-status">불러오는 중...</p>';
      overlay.hidden = false;
      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;

      var details = await ggLoadDetails();
      var d = details[code] || null;

      var priceHtml = item.hasDiscount
        ? '<div class="price-block"><div class="price-row"><span class="price-original">' + ggFmtNum(item.originalPrice) + '</span><span class="price-sale">' + ggFmtWon(item.salePrice) + '</span></div><span class="price-save">' + ggFmtWon(item.originalPrice - item.salePrice) + ' 절약</span></div>'
        : '<div class="price-block"><div class="price-row"><span class="price-sale">' + ggFmtWon(item.salePrice) + '</span></div></div>';

      var galleryHtml = '<div class="detail-gallery"><img src="' + item.image + '" alt="' + item.name + '" onerror="this.closest(\'.detail-gallery\').remove();" /></div>';

      var bodyHtml = d
        ? (
          (d.features && d.features.length ? '<div class="detail-section"><h3>✨ 특징</h3><ul class="detail-feature-list">' + d.features.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul></div>' : '') +
          (d.differentiation ? '<div class="detail-section"><h3>🌟 이런 점이 달라요</h3><p>' + d.differentiation + '</p></div>' : '') +
          (d.tip ? '<div class="detail-section"><h3>💡 이용팁</h3><p>' + d.tip + '</p></div>' : '') +
          ggBuildRecipesHtml(d.recipes) +
          ggBuildSpecsHtml(d.specs) +
          ggBuildReviewsHtml(d.reviews)
        )
        : '<div class="detail-section"><p class="detail-empty">상세 정보를 준비 중이에요. 매장에서 직접 확인해보세요!</p></div>';

      content.innerHTML =
        galleryHtml +
        '<div class="detail-body">' +
        '<h2 id="detail-title" class="detail-title">' + item.name + '</h2>' +
        '<p class="detail-desc">' + item.description + '</p>' +
        priceHtml +
        '<p class="gg-spec-line">' + item.spec + '</p>' +
        bodyHtml +
        '<button type="button" class="btn btn-primary detail-back-btn">← 돌아가기</button>' +
        '</div>';
    }

    function ggCloseDetail() {
      var overlay = document.getElementById('detail-overlay');
      if (!overlay) return;
      overlay.hidden = true;
      overlay.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    (function () {
      var closeBtn = document.getElementById('detail-close-btn');
      var content = document.getElementById('detail-content');
      if (closeBtn) closeBtn.addEventListener('click', ggCloseDetail);
      if (content) content.addEventListener('click', function (e) { if (e.target.closest('.detail-back-btn')) ggCloseDetail(); });

      // 페이지 이동마다 카드가 통째로 새로 그려지므로, document에 위임해 매번 새로 리스너를 달 필요가 없게 한다.
      document.addEventListener('click', function (e) {
        var card = e.target.closest('.product-card[data-code]');
        if (card) ggOpenDetail(card.dataset.code);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var card = e.target.closest('.product-card[data-code]');
        if (card) { e.preventDefault(); ggOpenDetail(card.dataset.code); }
      });
    })();

    /* ---------------- 금액대 탭(맨 위) + 맨 위로 ---------------- */

    (function () {
      var chips = Array.prototype.slice.call(document.querySelectorAll('#gg-filter .filter-chip'));
      var sections = chips.map(function (c) { return document.getElementById(c.dataset.band); });
      var fab = document.getElementById('gg-fab-top');

      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var target = document.getElementById(chip.dataset.band);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      function setActive(id) {
        chips.forEach(function (c) {
          c.setAttribute('aria-selected', c.dataset.band === id ? 'true' : 'false');
        });
      }

      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) setActive(entry.target.id);
            });
          },
          { rootMargin: '-45% 0px -50% 0px', threshold: 0 }
        );
        sections.forEach(function (s) { if (s) observer.observe(s); });
      }

      window.addEventListener('scroll', function () {
        if (fab) fab.classList.toggle('is-visible', window.scrollY > 480);
      }, { passive: true });

      if (fab) fab.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();

    /* ---------------- 첫 화면: 금액대마다 1페이지 렌더링 ---------------- */
    GG_BANDS.forEach(function (band) { ggGoToPage(band, 0); });
    // ggGoToPage가 최초 렌더링에서도 스크롤을 시도하므로, 페이지 로드 시엔 맨 위로 되돌려 둔다.
    window.scrollTo(0, 0);
  </script>

</body>
</html>
