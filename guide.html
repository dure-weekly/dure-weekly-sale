<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module">
</script>
<script type="module">
  import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs";

  const statusEl = document.getElementById("pdf-status");
  const viewerEl = document.getElementById("pdf-viewer");
  const titleEl = document.getElementById("doc-title");
  const pageTitleEl = document.getElementById("page-title");

  // ?src=파일명&title=제목 으로 다른 PDF도 같은 뷰어로 보여줄 수 있게 한다.
  // 파라미터가 없으면 기본값(생활재 안내책자)을 그대로 쓴다.
  const params = new URLSearchParams(location.search);
  const pdfSrc = params.get("src") || "dure-guide-2023.pdf";
  const docTitle = params.get("title") || "생활재 안내책자";
  titleEl.textContent = `📖 ${docTitle}`;
  pageTitleEl.textContent = `${docTitle} | 경기두레생협`;

  async function renderGuide() {
    try {
      // cMapUrl/standardFontDataUrl이 없으면 한글처럼 임베딩 서브셋 폰트를 쓰는 PDF에서
      // 도형·배경만 그려지고 글자는 안 그려지는 문제가 생긴다(2026-08-28 실제로 겪음).
      const pdf = await pdfjsLib.getDocument({
        url: pdfSrc,
        cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/",
        cMapPacked: true,
        standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/standard_fonts/",
      }).promise;
      statusEl.remove();

      // 화면 폭(여백 제외)에 맞춰 각 페이지 배율을 계산 — 모바일에서도 한 화면에 꽉 차게 보이도록.
      const containerWidth = Math.min(viewerEl.clientWidth || document.documentElement.clientWidth, 900);
      // 레티나 화면에서도 선명하게, 또한 손가락으로 확대(핀치줌)해도 글씨·QR코드가 흐려지지 않도록
      // devicePixelRatio보다 최소 2.5배 이상의 해상도로 캔버스를 그린다.
      const pixelRatio = Math.max(window.devicePixelRatio || 1, 2.5);

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = containerWidth / baseViewport.width;
        const viewport = page.getViewport({ scale: scale * pixelRatio });

        const canvas = document.createElement("canvas");
        canvas.className = "pdf-page-canvas";
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = `${viewport.width / pixelRatio}px`;
        canvas.style.height = `${viewport.height / pixelRatio}px`;
        viewerEl.appendChild(canvas);

        const context = canvas.getContext("2d");
        await page.render({ canvasContext: context, viewport }).promise;
      }
    } catch (err) {
      statusEl.textContent = "안내책자를 불러오지 못했습니다. 새로고침해보시거나 잠시 후 다시 시도해주세요.";
      console.error(err);
    }
  }

  renderGuide();
</script>
</body>
</html>
